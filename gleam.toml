name = "bchydro_proxy"
version = "1.0.0"
description = "Cloudflare Worker proxy for BC Hydro outage data with location-based filtering"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 0.34.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_fetch = ">= 1.3.1 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
